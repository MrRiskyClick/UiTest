<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Focus Lab</title><meta name="tv-build" content="20261027-hotupdate-4"><meta name="tv-version" content="0.03">
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1120;color:#fff;font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.toolbar{position:sticky;top:0;z-index:10;background:#171c2d;padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.toolbar button,.actions button,.editor button{border:1px solid #586581;background:#39445f;border-radius:8px;color:white;padding:10px 15px}.toolbar strong{color:#e5edff}.stage-wrap{position:relative;width:100%;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}.stage{flex:none;transform-origin:top left;width:2560px;height:1440px;margin:auto;padding:130px 100px;background:radial-gradient(ellipse at 10% 0%,#51439e,#292459 36%,#101024 70%,#020205);}.heading{text-align:center;letter-spacing:3px;text-transform:uppercase;font-size:21px;color:#c5c9e6;margin-bottom:48px}.row{display:flex;align-items:center;justify-content:center;gap:105px}.shows{margin-bottom:160px}.item{display:flex;flex-direction:column;align-items:center;flex-shrink:0}.tile{position:relative;isolation:isolate;border:0;background:transparent;padding:0;outline:none;transition:transform .2s}.tile.card{width:590px;height:332px;border-radius:18px}.tile.app{width:180px;height:180px;border-radius:50%}.tile::before{content:"";position:absolute;inset:-10px;background:#fff;filter:blur(22px);border-radius:inherit;opacity:0;z-index:-1;transition:opacity .2s}.tile.selected{transform:scale(1.045);z-index:2}.tile.selected:before{opacity:.85}.surface{position:absolute;inset:0;border:2px solid #ffffff35;border-radius:inherit;overflow:hidden;background:linear-gradient(140deg,#424969,#151a30)}.tile.selected .surface{border:2px solid white}.surface img{position:absolute;max-width:none;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#cbd3e8;font-size:22px}.name{margin-top:32px;font-size:23px;text-align:center}.apps{gap:145px}.apps .name{font-size:21px}.editor{display:none;margin:20px auto;padding:28px;max-width:1350px;border:1px solid #39445e;border-radius:14px;background:#171d2d}.editor.open{display:block}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px}.editor label{display:block;color:#c0c9df;font-size:14px;margin:17px 0 8px}.editor input[type=text],.editor input[type=url]{width:100%;padding:12px;border:1px solid #53617b;background:#0c1222;border-radius:8px;color:#fff}.editor input[type=range]{width:100%}.url-row,.actions{display:flex;gap:10px}.dropzone{min-height:390px;display:flex;align-items:center;justify-content:center;border:2px dashed #556587;border-radius:12px;background:#0c1221}.dropzone.over{border-color:white}.preview{position:relative;overflow:hidden;border:2px solid white;touch-action:none;cursor:grab;background:#262d42}.preview.card{width:560px;height:315px;border-radius:14px}.preview.app{width:300px;height:300px;border-radius:50%}.preview img{position:absolute;max-width:none;pointer-events:none}.hint{color:#aab8d6;font-size:14px}.actions{margin-top:23px}.primary{background:#e0e9ff!important;color:#17213b!important}.message{min-height:25px;color:#bfd0ee;font-size:14px}@media(max-width:1100px){.editor-grid{grid-template-columns:1fr}.editor{margin:12px}}

/* Fixed overlay controls never change the stage geometry. */
html,body{width:100%;height:100%;overflow:hidden}
.toolbar{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(340px,85vw);height:100dvh;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;padding:72px 20px 24px;background:#171c2df5;box-shadow:12px 0 38px #0006;transform:translateX(-105%);transition:transform .28s ease;flex-wrap:nowrap}
.toolbar.open{transform:translateX(0)}
.toolbar button{width:100%;text-align:left}
.toolbar strong{font-size:22px;margin-bottom:8px}
#menu-toggle{position:fixed;z-index:55;top:18px;left:18px;width:38px;height:38px;padding:5px;border:0;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 2px 5px #0009)}
#menu-toggle svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
#fullscreen{position:fixed;z-index:45;top:18px;right:18px;width:42px;height:42px;border:0;background:#0004;color:#fff;border-radius:8px;display:grid;place-items:center;cursor:pointer}
#fullscreen svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
#deploy-status{position:fixed;z-index:45;top:24px;right:76px;width:28px;height:28px;border:2px solid #fff9;border-radius:50%;background:#25c96b;box-shadow:0 0 12px #0008;cursor:pointer;display:none}
#deploy-status.outdated{background:#e63838}
:fullscreen #deploy-status{display:block}
#version-display{position:fixed;z-index:45;right:114px;top:26px;color:#fff;font-size:17px;font-weight:700;text-shadow:0 1px 6px #000a;display:none;white-space:nowrap}
:fullscreen #version-display{display:block}
.stage-wrap{width:100vw;height:100dvh;overflow:hidden}
.editor{position:fixed;z-index:42;top:4vh;left:50%;transform:translateX(-50%);width:min(1350px,96vw);max-height:92dvh;overflow:auto;margin:0;box-shadow:0 20px 80px #000c}
@media(max-width:1100px){.editor-grid{grid-template-columns:1fr}.editor{margin:0}}
body.embedded #fullscreen,body.embedded #deploy-status,body.embedded #version-display{display:none!important}</style>
</head>
<body>
<button id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="navigation"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><button id="fullscreen" aria-label="Enter fullscreen" title="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button><span id="version-display" aria-live="polite">V0.02</span><button id="deploy-status" aria-label="Refresh to update" title="Green: up to date. Red: new deployment available. Click to refresh."></button><div class="toolbar" id="navigation"><strong>TV Focus Lab</strong><span>Selected: <b id="selected-name">Golden Spider City</b></span><button id="edit">Add / Edit image</button><button id="remove">Remove image</button><button id="export">Export configuration</button><button id="import">Import configuration</button><input type="file" id="import-file" accept=".json,application/json" hidden><span class="hint">Arrow keys navigate · Browser saves edits locally</span></div>
<div class="stage-wrap"><main class="stage"><section class="shows"><div class="heading">Show cards</div><div class="row" id="cards"></div></section><section><div class="heading">App icons</div><div class="row apps" id="apps"></div></section></main></div>
<div class="editor" id="editor"><div class="editor-grid"><div><h2 id="edit-heading">Edit item</h2><label>Card / App title</label><input type="text" id="title" maxlength="100"><label>Image URL</label><div class="url-row"><input id="url" type="url" placeholder="https://example.com/image.jpg"><button id="load">Get image</button></div><label>Or upload an image</label><input type="file" id="file" accept="image/*"><label>Scale: <output id="zoom-label">100%</output></label><input type="range" id="zoom" min="100" max="400" value="100"><p class="hint">Drag to reposition. Mouse wheel or slider to zoom.</p><div class="actions"><button id="reset">Reset crop</button><button id="apply" class="primary">Apply</button><button id="cancel">Cancel</button></div><p class="message" id="message"></p></div><div><label>Drop image here or paste with Ctrl+V</label><div class="dropzone" id="drop"><div class="preview card" id="preview"><img id="preview-image" draggable="false" hidden></div></div><button id="paste" style="margin-top:12px">Paste from clipboard</button><p class="hint">Use local image files or paste actual pixels when an image host blocks direct loading.</p></div></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),defaults=['Golden Spider City','Mirai','The Bloody Man','Crunchyroll','Disney+','Prime Video'];
let state=defaults.map(name=>({name,image:null})),selected=0,editing=0,work=null,drag=null;
const storageKey='tv-focus-lab-v1',dbName='tv-focus-lab-data',storeName='settings';
let database=null,saveQueue=Promise.resolve();
function validItems(items){return Array.isArray(items)&&items.length===6&&items.every(item=>item&&typeof item.name==='string')}
function openDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const request=indexedDB.open(dbName,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(storeName))request.result.createObjectStore(storeName)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function readDatabase(db){return new Promise((resolve,reject)=>{const request=db.transaction(storeName,'readonly').objectStore(storeName).get('items');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function writeDatabase(db,items){return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(items,'items');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function save(){const snapshot=structuredClone(state);saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(database){await writeDatabase(database,snapshot);$('message').textContent='Artwork, titles and crops saved on this device.'}else{localStorage.setItem(storageKey,JSON.stringify(snapshot));$('message').textContent='Saved in browser storage (limited capacity).'}}).catch(err=>{$('message').textContent='Save failed: '+err.message+'. Export configuration for a backup.';console.error('Save failed',err)});return saveQueue}
async function restoreSavedState(){
let legacy=null;try{legacy=JSON.parse(localStorage.getItem(storageKey)||'null')}catch{}
try{database=await openDatabase();const saved=await readDatabase(database);if(validItems(saved))state=saved;else if(validItems(legacy)){state=legacy;await writeDatabase(database,state)}}
catch(err){console.warn('IndexedDB unavailable, using localStorage',err);if(validItems(legacy))state=legacy}
render();
}
function geometry(d,w,h){const s=Math.max(w/d.w,h/d.h)*d.zoom,iw=d.w*s,ih=d.h*s;return{iw,ih,maxX:Math.max(0,(iw-w)/2),maxY:Math.max(0,(ih-h)/2)}}
function applyImage(image,d,w,h){const g=geometry(d,w,h);image.style.width=g.iw+'px';image.style.height=g.ih+'px';image.style.left=((w-g.iw)/2+d.x*g.iw)+'px';image.style.top=((h-g.ih)/2+d.y*g.ih)+'px'}
function render(){for(let i=0;i<6;i++){const parent=$(i<3?'cards':'apps'),item=parent.querySelector('[data-id="'+i+'"]')?.parentNode||document.createElement('div');item.className='item';let button=item.querySelector('button');if(!button){button=document.createElement('button');button.dataset.id=i;button.onclick=()=>select(i);item.appendChild(button)}button.className='tile '+(i<3?'card':'app')+(i===selected?' selected':'');button.setAttribute('aria-label',state[i].name);button.replaceChildren();const surface=document.createElement('span');surface.className='surface';button.appendChild(surface);const d=state[i].image;if(d){const image=new Image();image.alt='';image.onload=()=>applyImage(image,d,surface.clientWidth,surface.clientHeight);image.src=d.url;surface.appendChild(image)}else{const empty=document.createElement('span');empty.className='empty';empty.textContent='+ Add image';surface.appendChild(empty)}let label=item.querySelector('.name');if(!label){label=document.createElement('div');label.className='name';item.appendChild(label)}label.textContent=state[i].name;parent.appendChild(item)}$('selected-name').textContent=state[selected].name}
function select(i){selected=i;render()}
function previewUpdate(){if(!work)return;const p=$('preview'),img=$('preview-image'),g=geometry(work,p.clientWidth,p.clientHeight);work.x=Math.max(-g.maxX/g.iw,Math.min(g.maxX/g.iw,work.x));work.y=Math.max(-g.maxY/g.ih,Math.min(g.maxY/g.ih,work.y));applyImage(img,work,p.clientWidth,p.clientHeight);img.hidden=false;$('zoom').value=Math.round(work.zoom*100);$('zoom-label').textContent=Math.round(work.zoom*100)+'%'}
function loadImage(url){const image=new Image();$('message').textContent='Loading image…';image.onload=()=>{work={url,w:image.naturalWidth,h:image.naturalHeight,zoom:1,x:0,y:0};$('preview-image').src=url;previewUpdate();$('message').textContent='Image loaded'};image.onerror=()=>{$('message').textContent='Image could not be loaded. Try uploading or pasting image pixels.'};image.src=url}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>loadImage(reader.result);reader.readAsDataURL(file)}
function transfer(dt){const image=[...(dt?.files||[])].find(f=>f.type.startsWith('image/'));if(image)return loadFile(image);const item=[...(dt?.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));if(item)return loadFile(item.getAsFile());const raw=dt?.getData('text/uri-list')||dt?.getData('text/plain')||'';if(/^https?:\/\//i.test(raw.trim())){loadImage(raw.trim());return}$('message').textContent='No image found in clipboard/drop.'}
$('edit').onclick=()=>{editing=selected;work=state[editing].image?{...state[editing].image}:null;$('editor').classList.add('open');$('edit-heading').textContent='Edit · '+state[editing].name;$('title').value=state[editing].name;$('url').value=work?.url?.startsWith('http')?work.url:'';$('preview').className='preview '+(editing<3?'card':'app');$('preview-image').hidden=!work;if(work){$('preview-image').src=work.url;requestAnimationFrame(previewUpdate)}$('message').textContent='';$('editor').scrollIntoView({behavior:'smooth',block:'start'})};
$('load').onclick=()=>{if(/^https?:\/\//.test($('url').value.trim()))loadImage($('url').value.trim())};
$('file').onchange=e=>loadFile(e.target.files[0]);
$('zoom').oninput=e=>{if(work){work.zoom=Number(e.target.value)/100;previewUpdate()}};
$('reset').onclick=()=>{if(work){work.zoom=1;work.x=0;work.y=0;previewUpdate()}};
const p=$('preview');p.onpointerdown=e=>{if(!work)return;drag={x:e.clientX,y:e.clientY,ox:work.x,oy:work.y};p.setPointerCapture(e.pointerId)};p.onpointermove=e=>{if(!drag||!work)return;const g=geometry(work,p.clientWidth,p.clientHeight);work.x=drag.ox+(e.clientX-drag.x)/g.iw;work.y=drag.oy+(e.clientY-drag.y)/g.ih;previewUpdate()};p.onpointerup=p.onpointercancel=()=>drag=null;p.addEventListener('wheel',e=>{if(!work)return;e.preventDefault();work.zoom=Math.max(1,Math.min(4,work.zoom+(e.deltaY<0?.05:-.05)));previewUpdate()},{passive:false});
const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');transfer(e.dataTransfer)};
document.addEventListener('paste',e=>{if(!$('editor').classList.contains('open')||e.target.matches('input'))return;transfer(e.clipboardData)});
$('paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type)return loadFile(await item.getType(type))}}catch{}$('message').textContent='Click the preview then press Ctrl+V.'};
$('apply').onclick=()=>{const name=$('title').value.trim();if(!name)return $('message').textContent='Enter a title';state[editing]={name,image:work?{...work}:null};selected=editing;save();render();$('editor').classList.remove('open')};
$('cancel').onclick=()=>$('editor').classList.remove('open');
$('remove').onclick=()=>{state[selected].image=null;save();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'tv-focus-lab',version:1,items:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tv-focus-lab-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('import-file').click();
$('import-file').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text()),items=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(items)||items.length!==6)throw Error('Expected six items');state=items;save();render();alert('Configuration imported')}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.editor'))return;const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];if(offset===undefined)return;const next=selected+offset;if(next<0||next>5)return;e.preventDefault();select(next)});
function fitStage(){
const wrap=document.querySelector('.stage-wrap'),stage=document.querySelector('.stage'),toolbar=document.querySelector('.toolbar');
const availableWidth=wrap.clientWidth;
const availableHeight=Math.max(1,window.innerHeight);
const scale=Math.min(availableWidth/2560,availableHeight/1440);
wrap.style.height=(1440*scale)+'px';
stage.style.transform='scale('+scale+')';
stage.style.marginLeft='0';
stage.style.marginRight='0';
stage.style.position='absolute';
stage.style.left='50%';
stage.style.top='0';
stage.style.marginLeft=(-1280*scale)+'px';
stage.style.transformOrigin='top left';
}
window.addEventListener('resize',fitStage);
$('menu-toggle').onclick=()=>{const open=$('navigation').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open));$('menu-toggle').setAttribute('aria-label',open?'Close navigation':'Open navigation')};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(err){console.warn('Fullscreen unavailable',err)}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').title=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen';fitStage()});
if(window.parent!==window){document.body.classList.add('embedded')}
const currentBuild=document.querySelector('meta[name="tv-build"]').content;
const currentVersion=document.querySelector('meta[name="tv-version"]').content;
$('version-display').textContent='V'+currentVersion;
async function checkDeployment(){
try{const response=await fetch(new URL('index.html?deployment_check='+Date.now(),location.href),{cache:'no-store'});if(!response.ok)return;const html=await response.text();const remoteBuild=html.match(/<meta name="tv-build" content="([^"]+)"/)?.[1];const remoteVersion=html.match(/<meta name="tv-version" content="([^"]+)"/)?.[1];if(remoteBuild){const outdated=remoteBuild!==currentBuild;$('version-display').textContent='V'+currentVersion+(outdated&&remoteVersion?' → V'+remoteVersion:'');$('deploy-status').classList.toggle('outdated',outdated);$('deploy-status').title=outdated?'New version deployed — click to refresh':'Up to date — click to refresh';$('deploy-status').setAttribute('aria-label',outdated?'New version available. Refresh':'Up to date. Refresh')}}catch(err){console.warn('Deployment check failed',err)}
}
$('deploy-status').onclick=()=>{try{sessionStorage.setItem('tv-restore-fullscreen','1')}catch{}location.reload()};
if(sessionStorage.getItem('tv-restore-fullscreen')==='1'){sessionStorage.removeItem('tv-restore-fullscreen');document.documentElement.requestFullscreen?.().catch(()=>{ $('fullscreen').title='Click to restore fullscreen after refresh' })}
if(window.parent===window){checkDeployment();setInterval(checkDeployment,15000)}

render();
fitStage();
restoreSavedState();
})();
</script>
</body>
</html>
