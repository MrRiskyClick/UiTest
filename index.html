<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Focus Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:white;font-family:system-ui,sans-serif}
#launcher{display:block;width:100%;height:100%;border:0;background:#0d1120}
#fullscreen{position:fixed;z-index:5;top:18px;right:18px;width:42px;height:42px;border:0;background:#0006;color:white;border-radius:8px;display:grid;place-items:center;cursor:pointer}
#fullscreen svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
#deploy-status{position:fixed;z-index:5;top:24px;right:76px;width:28px;height:28px;border:2px solid #fffa;border-radius:50%;background:#25c96b;box-shadow:0 0 12px #0008;cursor:pointer;display:none}
#deploy-status.outdated{background:#e63838}
#version-display{position:fixed;z-index:5;right:114px;top:26px;font-size:17px;font-weight:700;text-shadow:0 1px 6px #000a;display:none;white-space:nowrap}
:fullscreen #deploy-status,:fullscreen #version-display{display:block}
#notice{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;background:#131a30e8;border-radius:8px;padding:8px 14px;display:none;font-size:13px}
</style>
</head>
<body>
<iframe id="launcher" src="launcher.html" title="TV Focus Lab launcher" allow="fullscreen"></iframe>
<button id="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
<span id="version-display" aria-live="polite">Loading…</span>
<button id="deploy-status" title="Green: up to date. Red: update ready. Click to hot-update." aria-label="Check or install update"></button>
<div id="notice" role="status"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),frame=$('launcher');
let loadedBuild=null,loadedVersion=null,pendingBuild=null,pendingVersion=null,updating=false;
const getMeta=(html,name)=>{const tag=html.match(/<meta\s+name="tv-(?:build|version)"\s+content="[^"]+"/g)||[];const found=tag.find(x=>x.includes('name="'+name+'"'));return found?.match(/content="([^"]+)"/)?.[1]||null};
function note(message){$('notice').textContent=message;$('notice').style.display='block';clearTimeout(note.timer);note.timer=setTimeout(()=>$('notice').style.display='none',3500)}
function updateLabel(){
const changed=!!(pendingBuild&&loadedBuild&&pendingBuild!==loadedBuild);
$('deploy-status').classList.toggle('outdated',changed);
$('version-display').textContent='V'+(loadedVersion||'0.03')+(changed&&pendingVersion?' → V'+pendingVersion:'');
$('deploy-status').title=changed?'New version ready — click to hot-update':'Up to date — click to check again';
$('deploy-status').setAttribute('aria-label',changed?'Hot-update to version '+(pendingVersion||'new'):'Check for updates');
}
frame.addEventListener('load',()=>{
try{
const doc=frame.contentDocument;
loadedBuild=doc.querySelector('meta[name="tv-build"]')?.content||loadedBuild;
loadedVersion=doc.querySelector('meta[name="tv-version"]')?.content||loadedVersion;
}catch(err){console.warn('Unable to read embedded launcher version',err)}
updating=false;updateLabel();checkDeployment();
});
async function checkDeployment(){
try{
const response=await fetch('launcher.html?deployment_check='+Date.now(),{cache:'no-store'});
if(!response.ok)throw Error('HTTP '+response.status);
const html=await response.text();
pendingBuild=getMeta(html,'tv-build');
pendingVersion=getMeta(html,'tv-version');
updateLabel();
}catch(err){console.warn('Deployment check failed',err)}
}
function hotUpdate(){
if(updating)return;
if(!pendingBuild||pendingBuild===loadedBuild){checkDeployment();return}
updating=true;note('Updating launcher without leaving fullscreen…');
frame.src='launcher.html?hotupdate='+Date.now();
}
$('deploy-status').onclick=hotUpdate;
$('fullscreen').onclick=async()=>{
try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}
catch(err){note('Fullscreen was blocked by the browser.');console.warn(err)}
};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').title=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen'});
setInterval(checkDeployment,15000);
})();
</script>
</body></html>
