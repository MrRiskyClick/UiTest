<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Focus Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1120;color:#fff;font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.toolbar{position:sticky;top:0;z-index:10;background:#171c2d;padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.toolbar button,.actions button,.editor button{border:1px solid #586581;background:#39445f;border-radius:8px;color:white;padding:10px 15px}.toolbar strong{color:#e5edff}.stage-wrap{overflow:auto}.stage{width:2560px;height:1440px;margin:auto;padding:130px 100px;background:radial-gradient(ellipse at 10% 0%,#51439e,#292459 36%,#101024 70%,#020205);}.heading{text-align:center;letter-spacing:3px;text-transform:uppercase;font-size:21px;color:#c5c9e6;margin-bottom:48px}.row{display:flex;align-items:center;justify-content:center;gap:105px}.shows{margin-bottom:160px}.item{display:flex;flex-direction:column;align-items:center;flex-shrink:0}.tile{position:relative;isolation:isolate;border:0;background:transparent;padding:0;outline:none;transition:transform .2s}.tile.card{width:590px;height:332px;border-radius:18px}.tile.app{width:180px;height:180px;border-radius:50%}.tile::before{content:"";position:absolute;inset:-10px;background:#fff;filter:blur(22px);border-radius:inherit;opacity:0;z-index:-1;transition:opacity .2s}.tile.selected{transform:scale(1.045);z-index:2}.tile.selected:before{opacity:.85}.surface{position:absolute;inset:0;border:2px solid #ffffff35;border-radius:inherit;overflow:hidden;background:linear-gradient(140deg,#424969,#151a30)}.tile.selected .surface{border:2px solid white}.surface img{position:absolute;max-width:none;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#cbd3e8;font-size:22px}.name{margin-top:32px;font-size:23px;text-align:center}.apps{gap:145px}.apps .name{font-size:21px}.editor{display:none;margin:20px auto;padding:28px;max-width:1350px;border:1px solid #39445e;border-radius:14px;background:#171d2d}.editor.open{display:block}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px}.editor label{display:block;color:#c0c9df;font-size:14px;margin:17px 0 8px}.editor input[type=text],.editor input[type=url]{width:100%;padding:12px;border:1px solid #53617b;background:#0c1222;border-radius:8px;color:#fff}.editor input[type=range]{width:100%}.url-row,.actions{display:flex;gap:10px}.dropzone{min-height:390px;display:flex;align-items:center;justify-content:center;border:2px dashed #556587;border-radius:12px;background:#0c1221}.dropzone.over{border-color:white}.preview{position:relative;overflow:hidden;border:2px solid white;touch-action:none;cursor:grab;background:#262d42}.preview.card{width:560px;height:315px;border-radius:14px}.preview.app{width:300px;height:300px;border-radius:50%}.preview img{position:absolute;max-width:none;pointer-events:none}.hint{color:#aab8d6;font-size:14px}.actions{margin-top:23px}.primary{background:#e0e9ff!important;color:#17213b!important}.message{min-height:25px;color:#bfd0ee;font-size:14px}@media(max-width:1100px){.editor-grid{grid-template-columns:1fr}.editor{margin:12px}.stage{margin:0}}
</style>
</head>
<body>
<div class="toolbar"><strong>TV Focus Lab</strong><span>Selected: <b id="selected-name">Golden Spider City</b></span><button id="edit">Add / Edit image</button><button id="remove">Remove image</button><button id="export">Export configuration</button><button id="import">Import configuration</button><input type="file" id="import-file" accept=".json,application/json" hidden><span class="hint">Arrow keys navigate · Browser saves edits locally</span></div>
<div class="stage-wrap"><main class="stage"><section class="shows"><div class="heading">Show cards</div><div class="row" id="cards"></div></section><section><div class="heading">App icons</div><div class="row apps" id="apps"></div></section></main></div>
<div class="editor" id="editor"><div class="editor-grid"><div><h2 id="edit-heading">Edit item</h2><label>Card / App title</label><input type="text" id="title" maxlength="100"><label>Image URL</label><div class="url-row"><input id="url" type="url" placeholder="https://example.com/image.jpg"><button id="load">Get image</button></div><label>Or upload an image</label><input type="file" id="file" accept="image/*"><label>Scale: <output id="zoom-label">100%</output></label><input type="range" id="zoom" min="100" max="400" value="100"><p class="hint">Drag to reposition. Mouse wheel or slider to zoom.</p><div class="actions"><button id="reset">Reset crop</button><button id="apply" class="primary">Apply</button><button id="cancel">Cancel</button></div><p class="message" id="message"></p></div><div><label>Drop image here or paste with Ctrl+V</label><div class="dropzone" id="drop"><div class="preview card" id="preview"><img id="preview-image" draggable="false" hidden></div></div><button id="paste" style="margin-top:12px">Paste from clipboard</button><p class="hint">Use local image files or paste actual pixels when an image host blocks direct loading.</p></div></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),defaults=['Golden Spider City','Mirai','The Bloody Man','Crunchyroll','Disney+','Prime Video'];
let state=defaults.map(name=>({name,image:null})),selected=0,editing=0,work=null,drag=null;
const storageKey='tv-focus-lab-v1';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(saved)&&saved.length===6)state=saved}catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));$('message').textContent='Changes saved in this browser.'}catch{$('message').textContent='Browser storage is full. Use Export configuration to preserve images.'}}
function geometry(d,w,h){const s=Math.max(w/d.w,h/d.h)*d.zoom,iw=d.w*s,ih=d.h*s;return{iw,ih,maxX:Math.max(0,(iw-w)/2),maxY:Math.max(0,(ih-h)/2)}}
function applyImage(image,d,w,h){const g=geometry(d,w,h);image.style.width=g.iw+'px';image.style.height=g.ih+'px';image.style.left=((w-g.iw)/2+d.x*g.iw)+'px';image.style.top=((h-g.ih)/2+d.y*g.ih)+'px'}
function render(){for(let i=0;i<6;i++){const parent=$(i<3?'cards':'apps'),item=parent.querySelector('[data-id="'+i+'"]')?.parentNode||document.createElement('div');item.className='item';let button=item.querySelector('button');if(!button){button=document.createElement('button');button.dataset.id=i;button.onclick=()=>select(i);item.appendChild(button)}button.className='tile '+(i<3?'card':'app')+(i===selected?' selected':'');button.setAttribute('aria-label',state[i].name);button.replaceChildren();const surface=document.createElement('span');surface.className='surface';button.appendChild(surface);const d=state[i].image;if(d){const image=new Image();image.alt='';image.onload=()=>applyImage(image,d,surface.clientWidth,surface.clientHeight);image.src=d.url;surface.appendChild(image)}else{const empty=document.createElement('span');empty.className='empty';empty.textContent='+ Add image';surface.appendChild(empty)}let label=item.querySelector('.name');if(!label){label=document.createElement('div');label.className='name';item.appendChild(label)}label.textContent=state[i].name;parent.appendChild(item)}$('selected-name').textContent=state[selected].name}
function select(i){selected=i;render()}
function previewUpdate(){if(!work)return;const p=$('preview'),img=$('preview-image'),g=geometry(work,p.clientWidth,p.clientHeight);work.x=Math.max(-g.maxX/g.iw,Math.min(g.maxX/g.iw,work.x));work.y=Math.max(-g.maxY/g.ih,Math.min(g.maxY/g.ih,work.y));applyImage(img,work,p.clientWidth,p.clientHeight);img.hidden=false;$('zoom').value=Math.round(work.zoom*100);$('zoom-label').textContent=Math.round(work.zoom*100)+'%'}
function loadImage(url){const image=new Image();$('message').textContent='Loading image…';image.onload=()=>{work={url,w:image.naturalWidth,h:image.naturalHeight,zoom:1,x:0,y:0};$('preview-image').src=url;previewUpdate();$('message').textContent='Image loaded'};image.onerror=()=>{$('message').textContent='Image could not be loaded. Try uploading or pasting image pixels.'};image.src=url}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>loadImage(reader.result);reader.readAsDataURL(file)}
function transfer(dt){const image=[...(dt?.files||[])].find(f=>f.type.startsWith('image/'));if(image)return loadFile(image);const item=[...(dt?.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));if(item)return loadFile(item.getAsFile());const raw=dt?.getData('text/uri-list')||dt?.getData('text/plain')||'';if(/^https?:\/\//i.test(raw.trim())){loadImage(raw.trim());return}$('message').textContent='No image found in clipboard/drop.'}
$('edit').onclick=()=>{editing=selected;work=state[editing].image?{...state[editing].image}:null;$('editor').classList.add('open');$('edit-heading').textContent='Edit · '+state[editing].name;$('title').value=state[editing].name;$('url').value=work?.url?.startsWith('http')?work.url:'';$('preview').className='preview '+(editing<3?'card':'app');$('preview-image').hidden=!work;if(work){$('preview-image').src=work.url;requestAnimationFrame(previewUpdate)}$('message').textContent='';$('editor').scrollIntoView({behavior:'smooth',block:'start'})};
$('load').onclick=()=>{if(/^https?:\/\//.test($('url').value.trim()))loadImage($('url').value.trim())};
$('file').onchange=e=>loadFile(e.target.files[0]);
$('zoom').oninput=e=>{if(work){work.zoom=Number(e.target.value)/100;previewUpdate()}};
$('reset').onclick=()=>{if(work){work.zoom=1;work.x=0;work.y=0;previewUpdate()}};
const p=$('preview');p.onpointerdown=e=>{if(!work)return;drag={x:e.clientX,y:e.clientY,ox:work.x,oy:work.y};p.setPointerCapture(e.pointerId)};p.onpointermove=e=>{if(!drag||!work)return;const g=geometry(work,p.clientWidth,p.clientHeight);work.x=drag.ox+(e.clientX-drag.x)/g.iw;work.y=drag.oy+(e.clientY-drag.y)/g.ih;previewUpdate()};p.onpointerup=p.onpointercancel=()=>drag=null;p.addEventListener('wheel',e=>{if(!work)return;e.preventDefault();work.zoom=Math.max(1,Math.min(4,work.zoom+(e.deltaY<0?.05:-.05)));previewUpdate()},{passive:false});
const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');transfer(e.dataTransfer)};
document.addEventListener('paste',e=>{if(!$('editor').classList.contains('open')||e.target.matches('input'))return;transfer(e.clipboardData)});
$('paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type)return loadFile(await item.getType(type))}}catch{}$('message').textContent='Click the preview then press Ctrl+V.'};
$('apply').onclick=()=>{const name=$('title').value.trim();if(!name)return $('message').textContent='Enter a title';state[editing]={name,image:work?{...work}:null};selected=editing;save();render();$('editor').classList.remove('open')};
$('cancel').onclick=()=>$('editor').classList.remove('open');
$('remove').onclick=()=>{state[selected].image=null;save();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'tv-focus-lab',version:1,items:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tv-focus-lab-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('import-file').click();
$('import-file').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text()),items=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(items)||items.length!==6)throw Error('Expected six items');state=items;save();render();alert('Configuration imported')}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.editor'))return;const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];if(offset===undefined)return;const next=selected+offset;if(next<0||next>5)return;e.preventDefault();select(next)});
render();
})();
</script>
</body>
</html>
